name: Career Harness Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --dev
      - run: uv run pytest -q
      - run: uv run ruff check scripts tests
      - run: uv run python -m scripts.lib.validate_memory
      - run: uv run python scripts/setup_agents.py --check
      - run: ./scripts/harness check
