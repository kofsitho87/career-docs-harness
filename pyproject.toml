[project]
name = "career-harness"
version = "0.1.0"
description = "A provenance-backed AI harness for resumes and slide portfolios"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "jsonschema>=4.23,<5",
  "Jinja2>=3.1,<4",
  "Markdown>=3.7,<4",
  "Pillow>=11,<13",
  "playwright>=1.51,<2",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "PyYAML>=6,<7",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
